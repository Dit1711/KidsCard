# Run the WHOLE app locally in Docker, one command, zero config:
#
#   docker compose -f docker-compose.local.yml up --build
#   → open http://localhost:3000
#
# For testing on your own machine (no server, no Cloudflare). Uses baked dev
# secrets and simulated OTP. Needs Docker Desktop with ~6-8 GB available to it.

x-jvm-build: &jvm-build
  context: .
  dockerfile: Dockerfile

x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: kidscard
  DB_USER: kidscard
  DB_PASSWORD: kidscard_dev
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: kidscard_dev
  KAFKA_BROKERS: kafka:29092
  JWT_SECRET: kids-card-local-dev-secret-minimum-32-characters
  # Observability: export traces to Tempo (OTLP) and trace Kafka producers/consumers.
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  SPRING_KAFKA_TEMPLATE_OBSERVATION_ENABLED: "true"
  SPRING_KAFKA_LISTENER_OBSERVATION_ENABLED: "true"

x-depends: &depends-infra
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  kafka: { condition: service_healthy }

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kidscard
      POSTGRES_PASSWORD: kidscard_dev
      POSTGRES_DB: kidscard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidscard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass kidscard_dev --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "kidscard_dev", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_datalog:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: kafka-topics --bootstrap-server kafka:29092 --list
      interval: 10s
      timeout: 10s
      retries: 15

  auth-service:
    build: { <<: *jvm-build, args: { SERVICE: auth-service } }
    environment:
      <<: *service-env
      APP_OTP_DEV_FIXED_CODE: "123456"   # simulated SMS — any OTP is 123456
    depends_on: *depends-infra

  family-service:
    build: { <<: *jvm-build, args: { SERVICE: family-service } }
    environment:
      <<: *service-env
      APP_AUTH_SERVICE_URL: http://auth-service:8081
      APP_PAYMENT_SERVICE_URL: http://payment-service:8084
    volumes:
      - family_proofs:/data/proofs
    depends_on: *depends-infra

  card-service:
    build: { <<: *jvm-build, args: { SERVICE: card-service } }
    environment: { <<: *service-env }
    depends_on: *depends-infra

  payment-service:
    build: { <<: *jvm-build, args: { SERVICE: payment-service } }
    environment:
      <<: *service-env
      APP_FAMILY_SERVICE_URL: http://family-service:8082
    depends_on: *depends-infra

  open-banking-service:
    build: { <<: *jvm-build, args: { SERVICE: open-banking-service } }
    environment: { <<: *service-env }
    depends_on: *depends-infra

  notification-service:
    build: { <<: *jvm-build, args: { SERVICE: notification-service } }
    environment: { <<: *service-env }
    depends_on: *depends-infra

  kyc-service:
    build: { <<: *jvm-build, args: { SERVICE: kyc-service } }
    environment: { <<: *service-env }
    depends_on: *depends-infra

  compliance-service:
    build: { <<: *jvm-build, args: { SERVICE: compliance-service } }
    environment: { <<: *service-env }
    depends_on: *depends-infra

  ai-service:
    build: { <<: *jvm-build, args: { SERVICE: ai-service } }
    environment:
      <<: *service-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: *depends-infra

  web:
    build:
      context: web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - family-service
      - card-service
      - payment-service
      - open-banking-service
      - notification-service
      - kyc-service

  # ── Observability stack ──────────────────────────────────────────────
  # Tempo stores distributed traces (receives OTLP from every service).
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  # Prometheus scrapes /actuator/prometheus from every service + holds alert rules.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # Grafana — dashboards + datasources auto-provisioned. Open http://localhost:3001
  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
  family_proofs:
  tempo_data:
  prometheus_data:
  grafana_data:
