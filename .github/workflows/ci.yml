name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kidscard
          POSTGRES_PASSWORD: kidscard_ci
          POSTGRES_DB: kidscard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build -x test --parallel

      - name: Run tests
        run: ./gradlew test --parallel
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kidscard
          SPRING_DATASOURCE_USERNAME: kidscard
          SPRING_DATASOURCE_PASSWORD: kidscard_ci
          REDIS_HOST: localhost
          REDIS_PASSWORD: ''

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/*.xml'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/build/reports/tests/'

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images (no push)
        run: |
          for service in auth-service family-service card-service payment-service open-banking-service notification-service kyc-service api-gateway; do
            echo "Building $service..."
            docker build -f services/$service/Dockerfile -t kidscard/$service:ci . || echo "Dockerfile not yet created for $service"
          done
