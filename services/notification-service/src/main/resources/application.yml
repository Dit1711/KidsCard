spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kidscard}?currentSchema=notification
    username: ${DB_USER:kidscard}
    password: ${DB_PASSWORD:kidscard_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:kidscard_dev}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uz.kidscard: DEBUG
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET:kids-card-dev-secret-minimum-32-chars-long-key}
  push:
    vapid:
      # Dev VAPID keypair. Override via env in prod. The public key is shared
      # with browsers to subscribe; the private key signs push requests.
      public-key: ${VAPID_PUBLIC_KEY:BC4FKehtYR9MBDz4ofmpmSIFcoIexWu6LYiX-GSt7tULRT4PS8fr2Ip8DtoOAUQ2q30StAmHRypXZ2W3_8kUg9c}
      private-key: ${VAPID_PRIVATE_KEY:9Q2K1aNUumiwuYeqBTecGUhfW0ZR200s95h8l5C-qqc}
      subject: ${VAPID_SUBJECT:mailto:dit.kalanov@gmail.com}
