spring:
  application:
    name: kyc-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kidscard}?currentSchema=kyc
    username: ${DB_USER:kidscard}
    password: ${DB_PASSWORD:kidscard_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: kyc
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: kyc
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:kidscard_dev}
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: kyc-service
      auto-offset-reset: earliest

# KYC provider integration
kyc:
  provider:
    name: ${KYC_PROVIDER:mock}
    base-url: ${KYC_PROVIDER_URL:http://localhost:9999}
    api-key: ${KYC_PROVIDER_API_KEY:}
    timeout-ms: 30000
    liveness-check: true

server:
  port: ${SERVER_PORT:8087}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uz.kidscard: DEBUG
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET:kids-card-dev-secret-minimum-32-chars-long-key}
