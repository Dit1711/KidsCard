spring:
  application:
    name: compliance-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kidscard}?currentSchema=compliance
    username: ${DB_USER:kidscard}
    password: ${DB_PASSWORD:kidscard_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: compliance
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: compliance
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: compliance-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8088}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    uz.kidscard: DEBUG
    org.springframework.security: INFO

app:
  jwt:
    secret: ${JWT_SECRET:kids-card-dev-secret-minimum-32-chars-long-key}
